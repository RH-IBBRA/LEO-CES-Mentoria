<?xml version="1.0" encoding="UTF-8"?>
<!-- oPlanejador — simbolo. PROPOSTA, nao identidade final.
     Construcao: um "P" na gramatica de um simbolo monetario, cortado por
     duas barras (como em P e P). Haste grossa (11), bojo mais leve (9) para
     dar modulacao tipografica, serifa no topo a esquerda conversando com a
     Georgia da assinatura, e as duas barras fazendo tambem o pe da letra.
     Paths puros: nao depende de nenhuma fonte instalada.
     Versao para fundos ESCUROS. Para recolorir, troque o "stroke" do grupo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="86" viewBox="16 4 56 86" role="img" aria-label="oPlanejador">
  <g fill="none" stroke="#F2EFE8" stroke-linecap="butt">
    <path d="M40 9V86" stroke-width="11"/>
    <path d="M25 9h16" stroke-width="8"/>
    <path d="M45.5 14a21 21 0 0 1 0 40" stroke-width="9"/>
    <path d="M21 70h40M21 85h40" stroke-width="8"/>
  </g>
</svg>
