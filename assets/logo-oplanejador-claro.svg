<?xml version="1.0" encoding="UTF-8"?>
<!-- oPlanejador — simbolo (monograma oP). PROPOSTA, nao identidade final.
     Desenhado em paths puros: nao depende de nenhuma fonte instalada.
     Geometria: anel = "o" (raio 21, traco 8); haste do "P" (traco 9);
     barriga do "P" (raio 17.5, traco 8). Versao para fundos ESCUROS.
     Para fundo claro use logo-oplanejador.svg; para recolorir,
     troque o valor de "stroke" no grupo abaixo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="oPlanejador">
  <g fill="none" stroke="#F2EFE8" stroke-linecap="butt">
    <circle cx="31" cy="58" r="21" stroke-width="8"/>
    <path d="M68 17V83" stroke-width="9"/>
    <path d="M72.5 17a17.5 17.5 0 0 1 0 35" stroke-width="8"/>
  </g>
</svg>
