<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon: versao reduzida (so a letra) em areia sobre quadrado azul, para
     ficar visivel em aba clara e escura. O simbolo com anel nao entra aqui:
     a 16px o anel vira borrao. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="oPlanejador">
  <rect width="100" height="100" rx="20" fill="#142D3D"/>
  <g fill="none" stroke="#D9C7A3" stroke-linecap="butt" transform="translate(14.8 12.4) scale(0.8)">
    <path d="M40 9V86" stroke-width="11"/>
    <path d="M45.5 14a21 21 0 0 1 0 40" stroke-width="9"/>
    <path d="M21 70h40M21 85h40" stroke-width="8"/>
  </g>
</svg>
